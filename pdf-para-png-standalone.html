<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF para PNG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #eef1f5;
    --surface: #ffffff;
    --ink: #17202e;
    --muted: #5b6678;
    --line: #cfd6e0;
    --accent: #2447d8;
    --accent-ink: #ffffff;
    --accent-soft: #e3e9ff;
    --error: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10141b;
      --surface: #1a202b;
      --ink: #e8ecf2;
      --muted: #9aa4b5;
      --line: #313a4a;
      --accent: #7d98ff;
      --accent-ink: #0d1330;
      --accent-soft: #232d4d;
      --error: #ff8a80;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10141b;
    --surface: #1a202b;
    --ink: #e8ecf2;
    --muted: #9aa4b5;
    --line: #313a4a;
    --accent: #7d98ff;
    --accent-ink: #0d1330;
    --accent-soft: #232d4d;
    --error: #ff8a80;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 1rem;
    line-height: 1.5;
  }
  main { max-width: 60rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  h1 { font-size: clamp(2rem, 6vw, 3.25rem); line-height: 1.05; letter-spacing: -0.03em; margin: 0 0 0.5rem; font-weight: 700; }
  .lead { color: var(--muted); margin: 0 0 2rem; max-width: 36rem; }

  .drop {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.75rem;
    min-height: 13rem; padding: 2rem 1rem; text-align: center;
    background: var(--surface); border: 2px dashed var(--line); border-radius: 1rem;
    cursor: pointer; transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop:focus-visible, .drop.over { border-color: var(--accent); background: var(--accent-soft); outline: none; }
  .drop svg { width: 3rem; height: 3rem; color: var(--accent); }
  .drop strong { font-size: 1.125rem; }
  .drop span { color: var(--muted); font-size: 0.9375rem; }
  input[type=file] { display: none; }

  .controls {
    display: flex; flex-wrap: wrap; gap: 1rem 1.5rem; align-items: end;
    margin: 1.5rem 0 0;
  }
  .field { display: flex; flex-direction: column; gap: 0.35rem; }
  .field label { font-size: 0.875rem; color: var(--muted); font-weight: 500; }
  select, .btn {
    font: inherit; font-size: 0.9375rem; border-radius: 0.5rem; padding: 0.55rem 0.9rem;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  }
  .btn { cursor: pointer; font-weight: 600; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .status { margin: 1.5rem 0 0; color: var(--muted); min-height: 1.5rem; }
  .status.error { color: var(--error); }
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 0.5rem; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }

  .toolbar { display: none; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem; margin: 2rem 0 1rem; }
  .toolbar.show { display: flex; }
  .toolbar h2 { font-size: 1.25rem; margin: 0; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: 1.25rem; }
  figure { margin: 0; display: flex; flex-direction: column; gap: 0.5rem; }
  figure .thumb {
    background: #fff; border: 1px solid var(--line); border-radius: 0.375rem; overflow: hidden;
    aspect-ratio: 1 / 1.3; display: flex; align-items: center; justify-content: center;
  }
  figure img { max-width: 100%; max-height: 100%; display: block; }
  figcaption { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; font-size: 0.875rem; }
  figcaption .btn { padding: 0.3rem 0.65rem; font-size: 0.8125rem; }
  .note { color: var(--muted); font-size: 0.8125rem; margin-top: 2.5rem; }
</style>
</head>
<body>
<main>
  <h1>PDF para PNG</h1>
  <p class="lead">Escolha um PDF e cada página vira uma imagem PNG. Tudo é processado no seu navegador; o arquivo não é enviado para nenhum servidor.</p>

  <div class="drop" id="drop" tabindex="0" role="button" aria-label="Escolher arquivo PDF">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 11v6"/><path d="m9 14 3-3 3 3"/>
    </svg>
    <strong id="dropTitle">Arraste o PDF aqui ou clique para escolher</strong>
    <span id="dropSub">Apenas arquivos .pdf</span>
  </div>
  <input type="file" id="file" accept="application/pdf,.pdf">

  <div class="controls">
    <div class="field">
      <label for="dpi">Qualidade</label>
      <select id="dpi">
        <option value="96">Baixa (96 DPI)</option>
        <option value="150" selected>Média (150 DPI)</option>
        <option value="300">Alta (300 DPI)</option>
      </select>
    </div>
    <button class="btn primary" id="convert" disabled>Converter</button>
  </div>

  <div class="status" id="status" aria-live="polite"></div>
  <div class="bar" id="bar" hidden><div></div></div>

  <div class="toolbar" id="toolbar">
    <h2 id="count"></h2>
    <button class="btn primary" id="zip">Baixar todas (.zip)</button>
  </div>
  <div class="grid" id="grid"></div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const drop = $("drop"), fileInput = $("file"), convertBtn = $("convert");
  const statusEl = $("status"), bar = $("bar"), barFill = bar.firstElementChild;
  const grid = $("grid"), toolbar = $("toolbar"), countEl = $("count"), zipBtn = $("zip");

  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }

  let currentFile = null;
  let pages = []; // {name, blob, url}
  function updateDlNote() {}

  function setStatus(msg, isError) {
    statusEl.textContent = msg;
    statusEl.classList.toggle("error", !!isError);
  }

  function baseName(name) { return name.replace(/\.pdf$/i, "") || "documento"; }

  function pickFile(f) {
    if (!f) return;
    if (f.type !== "application/pdf" && !/\.pdf$/i.test(f.name)) {
      setStatus("Esse arquivo não é um PDF. Escolha um arquivo com extensão .pdf.", true);
      return;
    }
    currentFile = f;
    $("dropTitle").textContent = f.name;
    $("dropSub").textContent = (f.size / 1024 / 1024).toFixed(2) + " MB · clique para trocar";
    convertBtn.disabled = false;
    setStatus("");
  }

  drop.addEventListener("click", () => fileInput.click());
  drop.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); } });
  fileInput.addEventListener("change", () => pickFile(fileInput.files[0]));
  ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (e) => pickFile(e.dataTransfer.files[0]));

  function clearResults() {
    pages.forEach((p) => URL.revokeObjectURL(p.url));
    pages = [];
    grid.innerHTML = "";
    toolbar.classList.remove("show");
  }

  convertBtn.addEventListener("click", async () => {
    if (!currentFile) return;
    if (!window.pdfjsLib) { setStatus("Não foi possível carregar o leitor de PDF. Recarregue a página.", true); return; }
    clearResults();
    convertBtn.disabled = true;
    bar.hidden = false; barFill.style.width = "0";
    const scale = parseInt($("dpi").value, 10) / 72;
    const stem = baseName(currentFile.name);

    try {
      const data = new Uint8Array(await currentFile.arrayBuffer());
      const pdf = await pdfjsLib.getDocument({ data }).promise;
      const total = pdf.numPages;
      const digits = String(total).length;

      for (let i = 1; i <= total; i++) {
        setStatus(`Convertendo página ${i} de ${total}…`);
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale });
        const canvas = document.createElement("canvas");
        canvas.width = Math.floor(viewport.width);
        canvas.height = Math.floor(viewport.height);
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        await page.render({ canvasContext: ctx, viewport }).promise;
        const blob = await new Promise((r) => canvas.toBlob(r, "image/png"));
        const name = `${stem}_pagina_${String(i).padStart(digits, "0")}.png`;
        const url = URL.createObjectURL(blob);
        pages.push({ name, blob, url });
        addThumb(i, name, url, blob);
        page.cleanup();
        barFill.style.width = (i / total * 100) + "%";
      }

      countEl.textContent = total === 1 ? "1 página convertida" : `${total} páginas convertidas`;
      toolbar.classList.add("show");
      setStatus("Pronto.");
      updateDlNote();
    } catch (err) {
      console.error(err);
      const msg = err && err.name === "PasswordException"
        ? "Esse PDF é protegido por senha. Remova a senha e tente de novo."
        : "Não foi possível ler esse PDF. Verifique se o arquivo não está corrompido.";
      setStatus(msg, true);
    } finally {
      convertBtn.disabled = false;
      setTimeout(() => (bar.hidden = true), 600);
    }
  });

  function addThumb(i, name, url, blob) {
    const fig = document.createElement("figure");
    const thumb = document.createElement("div"); thumb.className = "thumb";
    const img = document.createElement("img"); img.src = url; img.alt = `Página ${i}`;
    thumb.appendChild(img);
    const cap = document.createElement("figcaption");
    const label = document.createElement("span"); label.textContent = `Página ${i}`;
    const btn = document.createElement("button"); btn.className = "btn dl"; btn.textContent = "Baixar";
    btn.addEventListener("click", () => save(name, blob));
    cap.append(label, btn);
    fig.append(thumb, cap);
    grid.appendChild(fig);
  }

  function save(filename, data) {
    const url = URL.createObjectURL(data);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  zipBtn.addEventListener("click", async () => {
    if (!pages.length || !window.JSZip) return;
    zipBtn.disabled = true;
    setStatus("Gerando arquivo .zip…");
    try {
      const zip = new JSZip();
      pages.forEach((p) => zip.file(p.name, p.blob));
      const blob = await zip.generateAsync({ type: "blob" });
      setStatus("Pronto.");
      await save(baseName(currentFile.name) + "_png.zip", blob);
    } finally {
      zipBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
